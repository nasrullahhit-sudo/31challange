<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>30-Day Personal Discipline Challenge Tracker</title>
<style>
:root{--bg:#0a0a0c;--card:#141418;--inp:#1d1d24;--line:#2a2a36;--txt:#f0f0f5;--mut:#9a9aab;--gold:#d4af37;--gold2:#f3cf55;--green:#2ecc71;--red:#e74c3c}
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,'Hind Siliguri',system-ui,sans-serif}
body{background:radial-gradient(900px 500px at 90% -10%,rgba(212,175,55,.09),transparent 60%),var(--bg);color:var(--txt);line-height:1.5;padding:15px;max-width:1200px;margin:0 auto}
header{text-align:center;margin-bottom:18px;border-bottom:1px solid var(--line);padding-bottom:14px}
h1{color:var(--gold);font-size:1.6rem;letter-spacing:.5px}.quote{font-style:italic;color:var(--mut);font-size:.95rem}
.dashboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}
.stat b{display:block;font-size:1.35rem;color:var(--gold);margin-top:3px}.stat span{font-size:.75rem;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:15px;margin-bottom:16px}
.card h2{font-size:1.05rem;color:var(--gold);margin-bottom:12px;border-bottom:1px solid var(--line);padding-bottom:6px}
.bar{background:var(--inp);border-radius:10px;height:14px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#b8860b,var(--gold));transition:width .35s}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.btn{background:var(--card);border:1px solid var(--gold);color:var(--gold);padding:10px 16px;border-radius:8px;cursor:pointer;font-weight:600;min-height:42px}
.btn:hover{background:var(--gold);color:var(--bg)}.btn.red{border-color:var(--red);color:var(--red)}.btn.red:hover{background:var(--red);color:#fff}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,.day:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:16px}
.day{min-width:64px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center;cursor:pointer;flex-shrink:0;color:var(--txt)}
.day small{display:block;font-size:.65rem;color:var(--mut)}.day.act{border-color:var(--gold);background:var(--inp)}
.day.ok{border-left:4px solid var(--green)}.day.part{border-left:4px solid var(--gold)}.day.miss{border-left:4px solid var(--red)}.day.fut{opacity:.5}.day.today small{color:var(--gold2)}
.grid{display:grid;grid-template-columns:1fr;gap:16px}@media(min-width:768px){.grid{grid-template-columns:3fr 2fr}}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #1a1a22}.item label{flex:1;cursor:pointer;font-size:.92rem}
